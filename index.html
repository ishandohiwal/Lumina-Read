<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Reads</title>

    <!-- Required Libraries for EPUB parsing and rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0f;
            color: #f5f5f5;
            min-height: 100vh;
        }

        /* Top navigation */
        .navbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #252529;
            background: #111113;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #1b1b1f;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .icon-button:hover {
            background: #29292f;
        }

        /* Main content */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 45px 30px;
        }

        .welcome {
            margin-bottom: 35px;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #92929a;
            font-size: 15px;
        }

        /* Upload area */
        .upload-box {
            border: 1px dashed #3b3b44;
            background: #151518;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            margin-bottom: 45px;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #8b5cf6;
            background: #18171d;
        }

        .upload-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .upload-box h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #85858d;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .upload-button {
            display: inline-block;
            background: #7c3aed;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .upload-button:hover {
            background: #8b5cf6;
        }

        #fileInput {
            display: none;
        }

        /* Library */
        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .library-header h2 {
            font-size: 22px;
        }

        .book-count {
            color: #777780;
            font-size: 14px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 25px;
        }

        .empty-library {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            border-radius: 16px;
            background: #151518;
            color: #777780;
        }

        .empty-library-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .book-card {
            background: #151518;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #252529;
        }

        .book-card:hover {
            transform: translateY(-4px);
            border-color: #7c3aed;
        }

        .book-cover {
            height: 180px;
            background: #252529;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 30px;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-title {
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-author {
            font-size: 13px;
            color: #777780;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Reader View Overlay */
        #reader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0d0f;
            z-index: 1000;
            flex-direction: column;
        }

        .reader-header {
            height: 60px;
            background: #111113;
            border-bottom: 1px solid #252529;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .reader-controls-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn, .close-reader {
            background: #252529;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .control-btn:hover, .close-reader:hover {
            background: #7c3aed;
        }

        /* Reader Settings Panel Popup */
        #settings-panel {
            display: none;
            position: absolute;
            top: 70px;
            right: 25px;
            background: #18181c;
            border: 1px solid #2f2f38;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            z-index: 1100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .setting-row {
            margin-bottom: 15px;
        }

        .setting-row label {
            display: block;
            font-size: 13px;
            color: #92929a;
            margin-bottom: 6px;
        }

        .setting-row select, .setting-row input {
            width: 100%;
            padding: 8px;
            background: #111113;
            border: 1px solid #3b3b44;
            color: white;
            border-radius: 6px;
        }

        /* Reader Body */
        .reader-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
            transition: background 0.3s;
        }

        #viewer {
            width: 100%;
            max-width: 800px;
            height: 100%;
            background: #151518;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .reader-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(25, 25, 30, 0.8);
            color: white;
            border: 1px solid #3b3b44;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }

        .reader-nav:hover {
            background: #7c3aed;
        }

        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }

        /* TTS Toolbar Bar Bottom */
        .tts-bar {
            height: 60px;
            background: #111113;
            border-top: 1px solid #252529;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
        }

        .tts-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tts-btn:hover { background: #8b5cf6; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .navbar { padding: 0 18px; }
            .container { padding: 30px 18px; }
            .welcome h1 { font-size: 28px; }
            #prev-btn { left: 10px; }
            #next-btn { right: 10px; }
        }
    </style>
</head>

<body>

    <!-- Main Dashboard UI -->
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">📖</div>
            <span>Lumina Reads</span>
        </div>
        <div class="nav-actions">
            <button class="icon-button">🔍</button>
            <button class="icon-button">⚙️</button>
        </div>
    </nav>

    <main class="container">
        <section class="welcome">
            <h1>My Library</h1>
            <p>Your books, your way.</p>
        </section>

        <section class="upload-box">
            <div class="upload-icon">📚</div>
            <h2>Add a book to your library</h2>
            <p>Upload an EPUB file and start reading.</p>
            <label for="fileInput" class="upload-button">
                + Add EPUB
            </label>
            <input type="file" id="fileInput" accept=".epub,application/epub+zip">
        </section>

        <section>
            <div class="library-header">
                <h2>Books</h2>
                <span class="book-count">0 books</span>
            </div>
            <div class="books">
                <div class="empty-library">
                    <div class="empty-library-icon">📖</div>
                    <p>
                        Your library is empty.
                        <br>
                        Add your first EPUB to get started.
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- Reader View Overlay -->
    <div id="reader-overlay">
        <div class="reader-header">
            <span id="reader-title" style="font-weight: 600; font-size: 16px;">Reading Book</span>
            <div class="reader-controls-group">
                <button class="control-btn" id="settingsToggleBtn">⚙️ Settings</button>
                <button class="close-reader" id="closeReaderBtn">Close Reader</button>
            </div>
        </div>

        <!-- Settings Popup Menu -->
        <div id="settings-panel">
            <div class="setting-row">
                <label>Reading Theme</label>
                <select id="themeSelect">
                    <option value="dark">Dark Mode</option>
                    <option value="light">Light Mode</option>
                    <option value="sepia">Sepia Mode</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Font Family</label>
                <select id="fontSelect">
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Times New Roman">Times New Roman</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Font Size (<span id="fontSizeVal">100%</span>)</label>
                <input type="range" id="fontSizeRange" min="80" max="180" value="100" step="5">
            </div>
        </div>

        <div class="reader-body" id="readerBodyContainer">
            <button class="reader-nav" id="prev-btn">&#10094;</button>
            <div id="viewer"></div>
            <button class="reader-nav" id="next-btn">&#10095;</button>
        </div>

        <!-- TTS Audio Toolbar -->
        <div class="tts-bar">
            <button class="tts-btn" id="ttsPlayBtn">🔊 Read Aloud</button>
            <button class="tts-btn" id="ttsPauseBtn" style="background:#3b3b44;">Pause</button>
            <select id="voiceSelect" style="padding: 6px; background:#18181c; color:white; border:1px solid #3b3b44; border-radius:6px;">
                <option value="">Loading Voices...</option>
            </select>
            <select id="ttsSpeed" style="padding: 6px; background:#18181c; color:white; border:1px solid #3b3b44; border-radius:6px;">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x Normal</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
            </select>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const fileInput = document.getElementById('fileInput');
        const booksContainer = document.querySelector('.books');
        const bookCountSpan = document.querySelector('.book-count');
        
        const readerOverlay = document.getElementById('reader-overlay');
        const closeReaderBtn = document.getElementById('closeReaderBtn');
        const readerTitle = document.getElementById('reader-title');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Settings Elements
        const settingsToggleBtn = document.getElementById('settingsToggleBtn');
        const settingsPanel = document.getElementById('settings-panel');
        const themeSelect = document.getElementById('themeSelect');
        const fontSelect = document.getElementById('fontSelect');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const readerBodyContainer = document.getElementById('readerBodyContainer');

        // TTS Elements
        const ttsPlayBtn = document.getElementById('ttsPlayBtn');
        const ttsPauseBtn = document.getElementById('ttsPauseBtn');
        const voiceSelect = document.getElementById('voiceSelect');
        const ttsSpeed = document.getElementById('ttsSpeed');

        let libraryBooks = [];
        let currentBook = null;
        let currentRendition = null;
        let synth = window.speechSynthesis;
        let voices = [];

        // Load Voices for TTS (Male/Female separation via system names)
        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                // Label with language and whether it looks female/male based on common voice names
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        // Handle File Upload
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const buffer = event.target.result;
                try {
                    const book = ePub(buffer);
                    const metadata = await book.loaded.metadata;
                    let coverUrl = null;
                    try { coverUrl = await book.coverUrl(); } catch (err) {}

                    libraryBooks.push({
                        title: metadata.title || file.name.replace('.epub', ''),
                        author: metadata.creator || 'Unknown Author',
                        cover: coverUrl || null,
                        buffer: buffer
                    });
                    renderLibrary();
                } catch (error) {
                    alert("Error parsing EPUB file.");
                }
            };
            reader.readAsArrayBuffer(file);
            fileInput.value = '';
        });

        // Render Library UI
        function renderLibrary() {
            bookCountSpan.textContent = `${libraryBooks.length} book${libraryBooks.length === 1 ? '' : 's'}`;
            if (libraryBooks.length === 0) {
                booksContainer.innerHTML = `
                    <div class="empty-library">
                        <div class="empty-library-icon">📖</div>
                        <p>Your library is empty.<br>Add your first EPUB to get started.</p>
                    </div>
                `;
                return;
            }

            booksContainer.innerHTML = '';
            libraryBooks.forEach((book, index) => {
                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                bookCard.innerHTML = `
                    <div class="book-cover">${book.cover ? `<img src="${book.cover}">` : '📖'}</div>
                    <div class="book-title" title="${book.title}">${book.title}</div>
                    <div class="book-author" title="${book.author}">${book.author}</div>
                `;
                bookCard.addEventListener('click', () => openBook(index));
                booksContainer.appendChild(bookCard);
            });
        }

        // Open Reader View
        function openBook(index) {
            const bookData = libraryBooks[index];
            readerTitle.textContent = bookData.title;
            readerOverlay.style.display = 'flex';
            document.getElementById('viewer').innerHTML = '';

            currentBook = ePub(bookData.buffer);
            currentRendition = currentBook.renderTo("viewer", {
                width: "100%",
                height: "100%",
                spread: "auto"
            });

            currentRendition.display().then(() => {
                applyReaderSettings();
            });
        }

        // Apply Reading Themes & Styles via ePub.js
        function applyReaderSettings() {
            if (!currentRendition) return;
            const theme = themeSelect.value;
            const font = fontSelect.value;
            const fontSize = fontSizeRange.value + '%';

            fontSizeVal.textContent = fontSize;

            // Background themes setup
            if (theme === 'dark') {
                readerBodyContainer.style.background = '#0d0d0f';
                currentRendition.themes.register("dark", { body: { background: "#151518 !important", color: "#f5f5f5 !important" } });
                currentRendition.themes.select("dark");
            } else if (theme === 'light') {
                readerBodyContainer.style.background = '#f4f4f6';
                currentRendition.themes.register("light", { body: { background: "#ffffff !important", color: "#111113 !important" } });
                currentRendition.themes.select("light");
            } else if (theme === 'sepia') {
                readerBodyContainer.style.background = '#e6dfd5';
                currentRendition.themes.register("sepia", { body: { background: "#fbf0d9 !important", color: "#5f4b32 !important" } });
                currentRendition.themes.select("sepia");
            }

            currentRendition.themes.font(font);
            currentRendition.themes.fontSize(fontSize);
        }

        // Event Listeners for Settings Controls
        settingsToggleBtn.addEventListener('click', () => {
            settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
        });
        themeSelect.addEventListener('change', applyReaderSettings);
        fontSelect.addEventListener('change', applyReaderSettings);
        fontSizeRange.addEventListener('input', applyReaderSettings);

        // Navigation
        prevBtn.addEventListener('click', () => { if (currentRendition) currentRendition.prev(); synth.cancel(); });
        nextBtn.addEventListener('click', () => { if (currentRendition) currentRendition.next(); synth.cancel(); });

        // Text-to-Speech (TTS) with Highlight Simulation
        ttsPlayBtn.addEventListener('click', async () => {
            if (!currentRendition) return;
            synth.cancel();

            // Extract visible text from current page/contents
            const contents = currentRendition.getContents();
            if (contents && contents.length > 0) {
                const text = contents[0].document.body.innerText;
                if (!text.trim()) {
                    alert("No readable text found on this page.");
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                if (voices[voiceSelect.value]) {
                    utterance.voice = voices[voiceSelect.value];
                }
                utterance.rate = parseFloat(ttsSpeed.value);

                // Highlight sentence chunks as it reads
                utterance.onboundary = (event) => {
                    if (event.name === 'sentence') {
                        // Optional visual feedback sync here
                    }
                };

                synth.speak(utterance);
            }
        });

        ttsPauseBtn.addEventListener('click', () => {
            if (synth.speaking) {
                if (synth.paused) {
                    synth.resume();
                    ttsPauseBtn.textContent = "Pause";
                } else {
                    synth.pause();
                    ttsPauseBtn.textContent = "Resume";
                }
            }
        });

        // Close Reader View
        closeReaderBtn.addEventListener('click', () => {
            readerOverlay.style.display = 'none';
            synth.cancel();
            if (currentBook) {
                currentBook.destroy();
                currentBook = null;
                currentRendition = null;
            }
        });

        loadVoices();
    </script>
</body>
</html>
