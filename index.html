<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumina Reads</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0f;
            color: #f5f5f5;
            min-height: 100vh;
        }

        /* Top navigation */

        .navbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #252529;
            background: #111113;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #1b1b1f;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .icon-button:hover {
            background: #29292f;
        }

        /* Main content */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 45px 30px;
        }

        .welcome {
            margin-bottom: 35px;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #92929a;
            font-size: 15px;
        }

        /* Upload area */

        .upload-box {
            border: 1px dashed #3b3b44;
            background: #151518;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            margin-bottom: 45px;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #8b5cf6;
            background: #18171d;
        }

        .upload-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .upload-box h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #85858d;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .upload-button {
            display: inline-block;
            background: #7c3aed;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .upload-button:hover {
            background: #8b5cf6;
        }

        #fileInput {
            display: none;
        }

        /* Library */

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .library-header h2 {
            font-size: 22px;
        }

        .book-count {
            color: #777780;
            font-size: 14px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 25px;
        }

        .empty-library {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            border-radius: 16px;
            background: #151518;
            color: #777780;
        }

        .empty-library-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        /* Mobile */

        @media (max-width: 600px) {
            .navbar {
                padding: 0 18px;
            }

            .container {
                padding: 30px 18px;
            }

            .welcome h1 {
                font-size: 28px;
            }

            .upload-box {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <div class="logo-icon">📖</div>
            <span>Lumina Reads</span>
        </div>

        <div class="nav-actions">
            <button class="icon-button">🔍</button>
            <button class="icon-button">⚙️</button>
        </div>

    </nav>


    <main class="container">

        <section class="welcome">
            <h1>My Library</h1>
            <p>Your books, your way.</p>
        </section>


        <section class="upload-box">

            <div class="upload-icon">📚</div>

            <h2>Add a book to your library</h2>

            <p>
                Upload an EPUB file and start reading.
            </p>

            <label for="fileInput" class="upload-button">
                + Add EPUB
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".epub,application/epub+zip"
            >

        </section>


        <section>

            <div class="library-header">
                <h2>Books</h2>
                <span class="book-count">0 books</span>
            </div>

            <div class="books">

                <div class="empty-library">

                    <div class="empty-library-icon">
                        📖
                    </div>

                    <p>
                        Your library is empty.
                        <br>
                        Add your first EPUB to get started.
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
